[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq-outperformance-predictor"
version = "0.1.0"
description = "Machine learning system for predicting stock outperformance relative to QQQ."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]